# Frequent scheduled jobs WITHOUT a paid Vercel plan (Hobby only allows daily crons, and vercel.json is therefore daily).
# Add repository secrets: APP_URL (e.g. https://nearme.vercel.app) and CRON_SECRET (same value as the Vercel env var).
name: cron
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Occasions + social publishing
        env: { APP_URL: "${{ secrets.APP_URL }}", CRON_SECRET: "${{ secrets.CRON_SECRET }}" }
        run: |
          [ -n "$APP_URL" ] || { echo 'APP_URL secret not set; skipping'; exit 0; }
          for p in occasions social-publish; do
            curl -fsS -m 30 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$p" || echo "failed: $p"
          done
