name: mobile
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: https://nearme-backend-otpprovider.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android projects
        run: bash ./scripts/bootstrap-flutter.sh

      - name: Analyze and test Flutter packages
        shell: bash
        run: |
          set -euo pipefail
          for p in packages/near_me_core packages/near_me_support apps/customer apps/admin apps/support; do
            (
              cd "mobile/$p"
              flutter analyze --no-fatal-infos --no-fatal-warnings
              if [ -d test ]; then flutter test; fi
            )
          done

      - name: Validate backend URL
        run: |
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error::API_BASE_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Verify live backend and database
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 "${API_BASE_URL%/}/api/health"

      - name: Build Customer APK
        run: |
          cd mobile/apps/customer
          flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Build Admin APK
        run: |
          cd mobile/apps/admin
          flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Build Support APK
        run: |
          cd mobile/apps/support
          flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: nearme-customer-debug-apk
          path: mobile/apps/customer/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: nearme-admin-debug-apk
          path: mobile/apps/admin/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Support APK
        uses: actions/upload-artifact@v4
        with:
          name: nearme-support-debug-apk
          path: mobile/apps/support/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release-signed:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: https://nearme-backend-otpprovider.vercel.app
      ADMOB_APP_ID: ca-app-pub-7996028022546373~2159885081
      ADMOB_BANNER_ID: ca-app-pub-7996028022546373/7029068384
      ADMOB_NATIVE_ID: ca-app-pub-7996028022546373/2898251681
      ADMOB_INTERSTITIAL_ID: ca-app-pub-7996028022546373/3893824494
      ADMOB_REWARDED_ID: ca-app-pub-7996028022546373/6328416147
      ADMOB_APP_OPEN_ID: ca-app-pub-7996028022546373/3668407870
      ADMOB_REWARDED_INTERSTITIAL_ID: ca-app-pub-7996028022546373/4981489542
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate signing secrets and stage the upload key
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository Actions secret: $name"
              exit 1
            fi
          done
          KEY_DIR="$RUNNER_TEMP/nearme-keys"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          KEYSTORE="$RUNNER_TEMP/nearme-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          for app in customer admin support; do
            cat > "$KEY_DIR/$app.key.properties" <<EOF
          storeFile=$KEYSTORE
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            chmod 600 "$KEY_DIR/$app.key.properties"
          done
          echo "ANDROID_KEYS_DIR=$KEY_DIR" >> "$GITHUB_ENV"

      - name: Prepare Android projects
        run: bash ./scripts/bootstrap-flutter.sh

      - name: Verify production AdMob identifiers
        run: bash ./scripts/verify-release-admob.sh

      - name: Verify backend endpoint
        shell: bash
        run: curl --fail --silent --show-error --max-time 25 "${API_BASE_URL%/}/api/health"

      - name: Build and verify signed APK and AAB for all three apps
        run: bash ./scripts/build-all.sh

      - name: Upload signed release artifacts and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: nearme-signed-apk-aab-and-symbols
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nearme-upload.jks"
          rm -rf "$RUNNER_TEMP/nearme-keys"
